modLoader="javafml"
loaderVersion="[4,)"
license="LGPL-3.0-only"
issueTrackerURL="https://github.com/raffman180/VSDH/issues"

[[mods]]
modId="vsdh"
version="${version}"
displayName="VSDH"
displayURL="https://github.com/raffman180/VSDH"
logoFile="vsdh_logo.png"
authors="Stranger; Braffolk and upstream contributors (rendering)"
credits="VulkanMod (xCollateral) and VulkanMod Reforged (Rindw); distant-horizons-vulkanmod (Braffolk); Vitrail shader code (avpbynf); Distant Horizons (James Seibel). See NOTICE."
description='''
Beta. Vulkan renderer with shader packs; renders Distant Horizons natively when DH is installed (optional).
Minecraft 1.21.1, NeoForge 21.1.264; DH 3.2.0-b and 3.3.0-3.3.3, one JAR for all.
Pick a shader pack under Video Settings > Shaders; it applies at once, also inside a world.
Contains its own Vulkan renderer: do not install VulkanMod, Sodium, Iris, Embeddium or Oculus with it.
Tested mainly on Windows with an NVIDIA GPU; not every shader pack, mod or GPU is supported yet.
'''

[[dependencies.vsdh]]
modId="minecraft"
type="required"
versionRange="[1.21.1]"
side="CLIENT"
[[dependencies.vsdh]]
modId="neoforge"
type="required"
versionRange="[21.1.264]"
side="CLIENT"
[[dependencies.vsdh]]
modId="vsdh_renderer"
type="required"
versionRange="[${renderer_version}]"
side="CLIENT"
[[dependencies.vsdh]]
modId="distanthorizons"
type="optional"
versionRange="[3.2.0-b],[3.3.0],[3.3.1],[3.3.2],[3.3.3]"
side="CLIENT"
[[dependencies.vsdh]]
modId="iris"
type="incompatible"
versionRange="[0,)"
side="CLIENT"
reason="VSDH loads shader packs itself with its Vulkan renderer; remove Iris."
[[dependencies.vsdh]]
modId="sodium"
type="incompatible"
versionRange="[0,)"
side="CLIENT"
reason="Sodium and the Vulkan renderer in VSDH both replace the terrain renderer; remove Sodium."
[[dependencies.vsdh]]
modId="embeddium"
type="incompatible"
versionRange="[0,)"
side="CLIENT"
reason="Embeddium and the Vulkan renderer in VSDH both replace the terrain renderer; remove Embeddium."
[[dependencies.vsdh]]
modId="vulkanmod"
type="incompatible"
versionRange="[0,)"
side="CLIENT"
reason="VSDH already contains its own copy of the Vulkan renderer (VulkanMod Reforged); remove the separate VulkanMod."
[[dependencies.vsdh]]
modId="oculus"
type="incompatible"
versionRange="[0,)"
side="CLIENT"
reason="VSDH loads shader packs itself; remove Oculus."

[[mixins]]
config="vsdh.mixins.json"

[[mods]]
modId="vsdh_renderer"
version="${renderer_version}"
displayName="VSDH Vulkan Renderer"
authors="xCollateral, VulkanMod contributors, Rindw; VSDH adaptations"
description="Unofficial VSDH fork of VulkanMod Reforged for Minecraft 1.21.1."

[[mixins]]
config="vulkanmod.mixins.json"

[[dependencies.vsdh_renderer]]
modId="neoforge"
type="required"
versionRange="[21.1.264]"
side="CLIENT"
[[dependencies.vsdh_renderer]]
modId="minecraft"
type="required"
versionRange="[1.21.1]"
side="CLIENT"
