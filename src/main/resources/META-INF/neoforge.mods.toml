modLoader="javafml"
loaderVersion="[4,)"
license="LGPL-3.0-only"

[[mods]]
modId="vsdh"
version="${version}"
displayName="VSDH (development build)"
authors="Stranger; Braffolk and upstream contributors (rendering)"
description='''
Experimental native Vulkan rendering bridge for Distant Horizons and VulkanMod Reforged.
Development target: Minecraft 1.21.1, NeoForge 21.1.264, DH 3.3.1–3.3.3.
Experimental shaderpack tests cover Complementary Reimagined and BSL with the native renderer.
Experimental shader selection is available through config/vsdh.json. Full world coverage is in development.
'''

[[dependencies.vsdh]]
modId="minecraft"
type="required"
versionRange="[1.21.1]"
side="CLIENT"
[[dependencies.vsdh]]
modId="neoforge"
type="required"
versionRange="[21.1.264]"
side="CLIENT"
[[dependencies.vsdh]]
modId="vulkanmod"
type="required"
versionRange="[${renderer_version}]"
side="CLIENT"
[[dependencies.vsdh]]
modId="distanthorizons"
type="required"
versionRange="[3.3.1,3.3.3]"
side="CLIENT"
[[dependencies.vsdh]]
modId="iris"
type="incompatible"
versionRange="[0,)"
side="CLIENT"
reason="This development milestone provides native DH rendering, not an Iris Vulkan backend."
[[dependencies.vsdh]]
modId="sodium"
type="incompatible"
versionRange="[0,)"
side="CLIENT"
reason="Sodium and VulkanMod Reforged replace the terrain renderer; simultaneous use is not implemented."

[[mixins]]
config="vsdh.mixins.json"

[[mods]]
modId="vulkanmod"
version="${renderer_version}"
displayName="VSDH Vulkan Renderer"
authors="xCollateral, VulkanMod contributors, Rindw; VSDH adaptations"
description="Unofficial VSDH fork of VulkanMod Reforged for Minecraft 1.21.1."

[[mixins]]
config="vulkanmod.mixins.json"

[[dependencies.vulkanmod]]
modId="neoforge"
type="required"
versionRange="[21.1.264]"
side="CLIENT"
[[dependencies.vulkanmod]]
modId="minecraft"
type="required"
versionRange="[1.21.1]"
side="CLIENT"
