plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = 'de.stranger.vsdh'
version = project.mod_version
base { archivesName = 'VSDH-neoforge-1.21.1' }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}
project.ext.lwjglVersion = '3.3.3'
project.ext.bundledNatives = ['natives-windows', 'natives-linux', 'natives-macos', 'natives-macos-arm64']
def host = org.gradle.internal.os.OperatingSystem.current()
project.ext.devNatives = host.windows ? 'natives-windows' : host.macOsX ?
        (System.getProperty('os.arch').contains('aarch64') ? 'natives-macos-arm64' : 'natives-macos') : 'natives-linux'


def currentDh = files('libs/DistantHorizons-3.3.3-1.21.1-fabric-neoforge.jar')
def earlyDh = files('libs/DistantHorizons-3.3.1-1.21.1-fabric-neoforge.jar')
sourceSets {
    dh33Early {
        compileClasspath = sourceSets.main.output + earlyDh + (sourceSets.main.compileClasspath - currentDh)
    }
    // Load-time adapter for DH 3.3.0; packed as a nested library JAR (NeoForge reads Java coremods from the
    // plugin layer). It sees the loader and ASM only, never the game, DH or the rest of VSDH.
    dh330 {
        compileClasspath = sourceSets.main.compileClasspath - currentDh
    }
    test { resources.srcDir 'src/smoke/resources' }
    smoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

neoForge {
    version = project.neo_version
    accessTransformers.from("src/main/resources/META-INF/accesstransformer.cfg")
    runs {
        client {
            client()
            jvmArguments.addAll('-Xmx6G', '-ea')
        }
        smokeClient {
            client()
            systemProperty 'vsdh.smoke', 'true'
            // The hand probe compares both depth snapshots; packs that read neither get none otherwise.
            systemProperty 'vsdh.allDepthSnapshots', 'true'
            systemProperty 'vsdh.smoke.livePack', providers.gradleProperty('smokeLivePack').getOrElse('false')
            systemProperty 'vsdh.smoke.dimensions', providers.gradleProperty('smokeDimensions').getOrElse('false')
            systemProperty 'vsdh.smoke.configuredPack', providers.gradleProperty('smokeConfiguredPack').getOrElse('false')
            systemProperty 'vsdh.smoke.rejectConfiguredPack', providers.gradleProperty('smokeRejectConfiguredPack').getOrElse('false')
            if (providers.gradleProperty('smokeGameDir').isPresent())
                gameDirectory.set(file(providers.gradleProperty('smokeGameDir').get()))
            systemProperty 'vsdh.smoke.entityShadows', providers.gradleProperty('smokeEntityShadows').getOrElse('false')
            systemProperty 'vsdh.smoke.lateEntities', providers.gradleProperty('smokeLateEntityDraws').getOrElse('false')
            systemProperty 'vsdh.smoke.distantPack', providers.gradleProperty('smokeDistantPack').getOrElse('false')
            if (providers.gradleProperty('smokeShaderPack').isPresent())
                systemProperty 'vsdh.smoke.pack', providers.gradleProperty('smokeShaderPack').get()
            programArguments.addAll('--width', '1280', '--height', '720')
            jvmArguments.addAll('-Xmx4G', '-ea')
        }
    }
    mods { vsdh { sourceSet sourceSets.main; sourceSet sourceSets.smoke } }
}

configurations { dhTools }

dependencies {

    dhTools 'org.ow2.asm:asm-commons:9.9.1'
    testImplementation sourceSets.dh330.output
    testImplementation 'org.ow2.asm:asm-commons:9.9.1'
    implementation currentDh
    compileOnly 'io.github.llamalad7:mixinextras-neoforge:0.5.3'
    compileOnly files('libs/flywheel-neoforge-1.21.1-1.0.6.jar')
    compileOnly('maven.modrinth:T9PomCSv:1L6XJqnY') { transitive = false }
    for (module in ['lwjgl-vulkan', 'lwjgl-shaderc', 'lwjgl-vma']) {
        implementation "org.lwjgl:${module}:${lwjglVersion}"
        additionalRuntimeClasspath "org.lwjgl:${module}:${lwjglVersion}"
        jarJar "org.lwjgl:${module}:${lwjglVersion}"
    }
    for (module in ['lwjgl-shaderc', 'lwjgl-vma']) {
        runtimeOnly "org.lwjgl:${module}:${lwjglVersion}:${devNatives}"
        additionalRuntimeClasspath "org.lwjgl:${module}:${lwjglVersion}:${devNatives}"
        bundledNatives.each { classifier -> jarJar "org.lwjgl:${module}:${lwjglVersion}:${classifier}" }
    }
    jarJar "org.lwjgl:lwjgl-vulkan:${lwjglVersion}:natives-macos"
    jarJar "org.lwjgl:lwjgl-vulkan:${lwjglVersion}:natives-macos-arm64"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:${devNatives}"
    testImplementation 'org.joml:joml:1.10.5'
    testRuntimeOnly 'org.slf4j:slf4j-api:2.0.9'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test', Test) { useJUnitPlatform() }
tasks.register('auditShaderPack', JavaExec) {
    group = 'verification'
    description = 'Translates and compiles an external shaderpack without starting Minecraft or requiring a GPU.'
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'de.stranger.vsdh.smoke.PackCompileAudit'
    args providers.gradleProperty('shaderPack').getOrElse('run/shaderpacks/ComplementaryReimagined_r5.9.3.zip'),
            layout.buildDirectory.dir('shader-audit').get().asFile.absolutePath,
            providers.gradleProperty('shaderProfile').getOrElse('MEDIUM')
}
tasks.register('auditRenderGraph', JavaExec) {
    group = 'verification'
    description = 'Prepares the actual shader pass chain and estimates all color target allocations without a GPU.'
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'de.stranger.vsdh.smoke.RenderGraphAudit'
    args providers.gradleProperty('shaderPack').getOrElse('run/shaderpacks/ComplementaryReimagined_r5.9.3.zip'),
            providers.gradleProperty('shaderProfile').getOrElse('MEDIUM')
}

tasks.register('auditWorldHost', JavaExec) {
    group = 'verification'
    description = 'Reports missing world-uniform and resource support for an external pack; does not assert runtime compatibility.'
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'de.stranger.vsdh.smoke.WorldHostAudit'
    args providers.gradleProperty('shaderPack').getOrElse('run/shaderpacks/ComplementaryReimagined_r5.9.3.zip'),
            layout.buildDirectory.file('world-host-audit.json').get().asFile.absolutePath,
            providers.gradleProperty('smokeDistantPack').getOrElse('false'),
            providers.gradleProperty('shaderProfile').getOrElse('MEDIUM')
}
tasks.register('benchPackPrepare', JavaExec) {
    group = 'verification'
    description = 'Times the preparation of an external shaderpack per phase without starting Minecraft or requiring a GPU.'
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'de.stranger.vsdh.smoke.PackPrepareBench'
    args providers.gradleProperty('shaderPack').getOrElse('run/shaderpacks/ComplementaryReimagined_r5.9.3.zip'),
            providers.gradleProperty('shaderProfile').getOrElse('MEDIUM'),
            providers.gradleProperty('smokeDistantPack').getOrElse('false'),
            providers.gradleProperty('benchRuns').getOrElse('1')
    // -PbenchProps=vsdh.spirvCache=false,vsdh.prepareThreads=1 (comma separated name=value pairs)
    providers.gradleProperty('benchProps').getOrElse('').split(',').each { pair ->
        if (pair.contains('=')) systemProperty pair.substring(0, pair.indexOf('=')), pair.substring(pair.indexOf('=') + 1)
    }
}
processResources {
    inputs.property 'version', project.version
    inputs.property 'rendererVersion', project.renderer_version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version, renderer_version: project.renderer_version }
}
// One JAR for every supported DH version: this nested library rewrites VSDH's DH references while
// its classes load, only when DH 3.3.0 is installed (de.stranger.vsdh.dh330.Dh330CoreMod).
def dh330LibraryName = "vsdh-dh330-${version}.jar".toString()
tasks.register('dh330LibraryJar', Jar) {
    group = 'build'
    description = 'Builds the nested library with the load-time adapter for DH 3.3.0.'
    archiveFileName = dh330LibraryName
    destinationDirectory = layout.buildDirectory.dir('dh330')
    from sourceSets.dh330.output
    from('LICENSE', 'COPYING', 'NOTICE')
    manifest {
        attributes 'FMLModType': 'LIBRARY', 'Automatic-Module-Name': 'vsdh.dh330',
                'Implementation-Title': 'VSDH DH 3.3.0 adapter', 'Implementation-Version': project.version
    }
}
tasks.named('jar', Jar) {
    dependsOn 'dh330LibraryJar'
    inputs.file tasks.named('dh330LibraryJar').flatMap { it.archiveFile }
    from sourceSets.dh33Early.output
    from('LICENSE', 'COPYING', 'NOTICE')
    from('docs/upstream') { into 'META-INF/vsdh/attribution' }
}
tasks.named('sourcesJar', Jar) {
    from sourceSets.dh33Early.allSource
    from sourceSets.dh330.allSource
    from('LICENSE', 'COPYING', 'NOTICE')
    from('docs/upstream') { into 'META-INF/vsdh/attribution' }
}

tasks.register('verifyDependencies') {
    group = 'verification'
    description = 'Checks the exact renderer and DH binaries used for this development build.'
    doLast {
        def pins = [
            'libs/DistantHorizons-3.3.1-1.21.1-fabric-neoforge.jar': ['SHA-1', '740532bd920ba59b828caa4eebc3cf90160556c1'],
            'libs/DistantHorizons-3.3.3-1.21.1-fabric-neoforge.jar': ['SHA-1', '4357b4d19fab818780c94f0e43dad1cc931634b2'],
            'libs/flywheel-neoforge-1.21.1-1.0.6.jar': ['SHA-256', '31dda15c205eb596d3b3449ef03f6af7363a6cd35b3da4bfe916b304f9e5337e']
        ]
        pins.each { path, pin ->
            def input = file(path)
            if (!input.isFile()) throw new GradleException("Missing ${path}; see libs/README.md")
            def actual = java.security.MessageDigest.getInstance(pin[0]).digest(input.bytes).encodeHex().toString()
            if (actual != pin[1]) throw new GradleException("Dependency hash mismatch: ${path}")
        }
    }
}
tasks.named('compileJava') { dependsOn 'verifyDependencies' }

configurations.jarJar {
    exclude group: 'org.lwjgl', module: 'lwjgl'
    exclude group: 'org.lwjgl', module: 'lwjgl-glfw'
    exclude group: 'org.lwjgl', module: 'lwjgl-opengl'
    exclude group: 'org.lwjgl', module: 'lwjgl-stb'
}


tasks.named('jar') {
    doLast {
        def jarFile = archiveFile.get().asFile
        def tmpDir = new File(temporaryDir, "repack")

        tmpDir.deleteDir()
        tmpDir.mkdirs()
        ant.unzip(src: jarFile, dest: tmpDir)

        def jarjarDir = new File(tmpDir, "META-INF/jarjar")
        if (jarjarDir.exists()) {
            jarjarDir.listFiles().findAll { it.name.endsWith('.jar') && it.name.startsWith('lwjgl-') }.each { embeddedJar ->
                def stripped = new File(temporaryDir, "stripped-${embeddedJar.name}")
                ant.zip(destfile: stripped) {
                    zipfileset(src: embeddedJar) {
                        exclude(name: 'module-info.class')
                        exclude(name: 'META-INF/versions/*/module-info.class')
                    }
                }
                embeddedJar.delete()
                stripped.renameTo(embeddedJar)
            }

            def dh330Library = tasks.named('dh330LibraryJar').get().archiveFile.get().asFile
            ant.copy(file: dh330Library, todir: jarjarDir)

            def metadataFile = new File(jarjarDir, "metadata.json")
            if (metadataFile.exists()) {
                def slurper = new groovy.json.JsonSlurper()
                def metadata = slurper.parseText(metadataFile.text)
                metadata.jars.add([
                        identifier: [group: 'de.stranger.vsdh', artifact: 'vsdh-dh330'],
                        version: [range: "[${project.version},)".toString(), artifactVersion: project.version.toString()],
                        path: "META-INF/jarjar/${dh330Library.name}".toString(),
                        isObfuscated: false
                ])
                metadata.jars.each { jarEntry ->
                    def m = (jarEntry.path =~ /-(natives-[a-z0-9-]+)\.jar$/)
                    if (m) {
                        jarEntry.identifier.artifact += "-" + m[0][1]
                    }
                }
                metadataFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata))
            }
        }

        jarFile.delete()
        ant.zip(destfile: jarFile, basedir: tmpDir)
    }
}

tasks.register('verifyDhLinks', JavaExec) {
    group = 'verification'
    description = 'Checks the single VSDH JAR against DH JARs: every DH class and member it references exists under the name that DH version uses.'
    def vsdhJar = tasks.named('jar', Jar)
    dependsOn vsdhJar
    def source = file('tools/VerifyDhLinks.java')
    // Reference files are never shipped; -PdhJars=a;b;c overrides the list.
    def references = providers.gradleProperty('dhJars').map { it.split(';') as List }.getOrElse([
            'build/reference/dh-matrix/DistantHorizons-3.2.0-b-1.21.1-fabric-neoforge.jar',
            'build/reference/dh-matrix/DistantHorizons-3.3.0-1.21.1-fabric-neoforge.jar',
            'build/reference/dh-matrix/DistantHorizons-3.3.1-1.21.1-fabric-neoforge.jar',
            'build/reference/DistantHorizons-3.3.2-1.21.1-fabric-neoforge.jar',
            'build/reference/iris-client/libs/DistantHorizons-3.3.3-1.21.1-fabric-neoforge.jar'
    ]).collect { file(it) }
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    classpath = configurations.dhTools + sourceSets.dh330.output
    mainClass = source.absolutePath
    args vsdhJar.get().archiveFile.get().asFile.absolutePath
    args references.collect { it.absolutePath }
    inputs.file source
    inputs.files references
    inputs.file vsdhJar.flatMap { it.archiveFile }
}

tasks.register('verifyBundledLwjgl') {
    group = 'verification'
    description = 'Verifies that the production jar contains loadable LWJGL Vulkan and native artifacts.'
    dependsOn tasks.named('jar')

    doLast {
        def outputJar = tasks.named('jar').get().archiveFile.get().asFile
        def requiredPaths = [
                "META-INF/jarjar/lwjgl-vulkan-${lwjglVersion}.jar",
                "META-INF/jarjar/lwjgl-vulkan-${lwjglVersion}-natives-macos.jar",
                "META-INF/jarjar/lwjgl-vulkan-${lwjglVersion}-natives-macos-arm64.jar",
                "META-INF/jarjar/lwjgl-shaderc-${lwjglVersion}.jar",
                "META-INF/jarjar/lwjgl-shaderc-${lwjglVersion}-natives-windows.jar",
                "META-INF/jarjar/lwjgl-shaderc-${lwjglVersion}-natives-linux.jar",
                "META-INF/jarjar/lwjgl-shaderc-${lwjglVersion}-natives-macos.jar",
                "META-INF/jarjar/lwjgl-shaderc-${lwjglVersion}-natives-macos-arm64.jar",
                "META-INF/jarjar/lwjgl-vma-${lwjglVersion}.jar",
                "META-INF/jarjar/lwjgl-vma-${lwjglVersion}-natives-windows.jar",
                "META-INF/jarjar/lwjgl-vma-${lwjglVersion}-natives-linux.jar",
                "META-INF/jarjar/lwjgl-vma-${lwjglVersion}-natives-macos.jar",
                "META-INF/jarjar/lwjgl-vma-${lwjglVersion}-natives-macos-arm64.jar",
                "META-INF/jarjar/${dh330LibraryName}",
        ].collect { it.toString() }

        def outer = new java.util.zip.ZipFile(outputJar)
        try {
            requiredPaths.each { path ->
                if (outer.getEntry(path) == null) {
                    throw new GradleException("Missing bundled dependency: ${path}")
                }
            }

            def metadataEntry = outer.getEntry('META-INF/jarjar/metadata.json')
            if (metadataEntry == null) {
                throw new GradleException('Missing META-INF/jarjar/metadata.json')
            }
            def metadata = outer.getInputStream(metadataEntry).withCloseable { stream ->
                new groovy.json.JsonSlurper().parse(stream)
            }
            def metadataPaths = metadata.jars.collect { it.path } as Set
            if (!metadataPaths.containsAll(requiredPaths)) {
                throw new GradleException('JarJar metadata does not list every bundled LWJGL artifact')
            }
            def identifiers = metadata.jars.collect { "${it.identifier.group}:${it.identifier.artifact}" }
            if (identifiers.size() != identifiers.toSet().size()) {
                throw new GradleException('JarJar metadata contains duplicate dependency identifiers')
            }

            def verifyNestedJar = { String path, List<String> requiredEntries ->
                temporaryDir.mkdirs()
                def nestedFile = File.createTempFile('vulkanmod-lwjgl-', '.jar', temporaryDir)
                try {
                    outer.getInputStream(outer.getEntry(path)).withCloseable { input ->
                        nestedFile.withOutputStream { output -> output << input }
                    }
                    def nested = new java.util.zip.ZipFile(nestedFile)
                    try {
                        requiredEntries.each { entry ->
                            if (nested.getEntry(entry) == null) {
                                throw new GradleException("${path} is missing ${entry}")
                            }
                        }
                        if (nested.entries().toList().any { it.name == 'module-info.class'
                                || (it.name.startsWith('META-INF/versions/') && it.name.endsWith('/module-info.class')) }) {
                            throw new GradleException("${path} still contains module-info.class")
                        }
                    } finally {
                        nested.close()
                    }
                } finally {
                    nestedFile.delete()
                }
            }

            verifyNestedJar(requiredPaths[0], ['org/lwjgl/vulkan/VK.class'])
            verifyNestedJar(requiredPaths[1], ['macos/x64/org/lwjgl/vulkan/libMoltenVK.dylib'])
            verifyNestedJar(requiredPaths[2], ['macos/arm64/org/lwjgl/vulkan/libMoltenVK.dylib'])
        } finally {
            outer.close()
        }

        logger.lifecycle("Verified bundled LWJGL Vulkan, shaderc, VMA, and macOS MoltenVK in ${outputJar.name}")
    }
}
